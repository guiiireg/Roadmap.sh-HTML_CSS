    <main>
      <section>
        <h2>Contact</h2>
        <form method="post">
          <label for="name">Nom :</label>
          <input type="text" id="name" name="user_name" required autocomplete="name" />

          <label for="email">Email :</label>
          <input type="email" id="email" name="user_mail" required autocomplete="email" />

          <label for="msg">Message :</label>
          <textarea id="msg" name="user_message" required autocomplete="off"></textarea>

          <button type="submit">Envoyer votre message</button>
        </form>
      </section>
    </main>
